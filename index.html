<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>训练打卡 - Cycle 2 · 体态纠正</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; margin: 0; padding: 0 0 80px 0; color: #1a1a2e;
  font-size: 16px; line-height: 1.5;
}
.app-header {
  background: linear-gradient(135deg, #1b3a2d, #2d5a3e);
  color: #fff; padding: 16px 18px; position: sticky; top: 0; z-index: 10;
}
.app-header h1 { margin: 0; font-size: 20px; font-weight: 700; }
.app-header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
.session-bar {
  display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px;
  background: #fff; border-bottom: 1px solid #e0e3e8;
  -webkit-overflow-scrolling: touch; position: sticky; top: 74px; z-index: 9;
}
.session-btn {
  flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid #d0d4dc;
  background: #fff; font-size: 13px; font-weight: 600; color: #555; cursor: pointer;
  white-space: nowrap; transition: all 0.2s;
}
.session-btn.active { background: #2d7d46; color: #fff; border-color: #2d7d46; }
.session-btn.done { border-color: #2d7d46; color: #2d7d46; }
.session-btn.done::after { content: ' ✅'; font-size: 11px; }
.save-indicator {
  text-align: center; font-size: 12px; color: #999; padding: 6px;
  position: sticky; top: 126px; background: #f0f2f5; z-index: 8;
}
.pre-section, .warmup-section, .cardio-section, .bottom-section {
  background: #fff; margin: 10px 14px; border-radius: 10px; padding: 14px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.pre-section h3, .warmup-section h3, .cardio-section h3, .bottom-section h3 { font-size: 14px; margin: 0 0 10px; font-weight: 600; color: #555; }
.pre-grid, .tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pre-grid label, .tag-group label {
  font-size: 14px; padding: 6px 12px; border: 1.5px solid #d0d4dc;
  border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 4px;
  background: #fafbff; transition: all 0.15s; user-select: none;
}
.pre-grid label:has(input:checked), .tag-group label:has(input:checked) {
  background: #e8f5e9; border-color: #2d7d46;
}
.note-banner {
  margin: 10px 14px; padding: 10px 14px; border-radius: 10px;
  background: #fff6e5; border-left: 4px solid #f5a623; font-size: 14px; color: #8a6300;
}
.goal-banner {
  margin: 0 14px 10px; padding: 10px 14px; border-radius: 10px;
  background: #e8f0fe; border-left: 4px solid #1a6fb5; font-size: 13px; color: #1a6fb5;
}
/* Warm-up checklist */
.warmup-grid { display: flex; flex-direction: column; gap: 6px; }
.warmup-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid #f0f2f5; font-size: 14px; flex-wrap: wrap;
}
.warmup-row:last-child { border-bottom: none; }
.warmup-row .warmup-line1 {
  display: flex; align-items: center; gap: 6px; flex: 1 1 100%; min-width: 0;
}
.warmup-row .warmup-num { font-weight: 700; color: #2d7d46; min-width: 14px; flex-shrink: 0; }
.warmup-row .warmup-name { font-weight: 600; white-space: nowrap; }
.warmup-row .warmup-how {
  font-size: 13px; color: #888; padding-left: 28px; width: 100%;
  line-height: 1.4;
}
.card {
  background: #fff; margin: 10px 14px; border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden;
}
.card-header {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px;
}
.card-num { font-size: 16px; font-weight: 700; color: #2d7d46; min-width: 20px; }
.card-name { font-size: 16px; font-weight: 700; }
.card-meta-line {
  display: flex; align-items: center; gap: 8px; padding: 0 16px 6px;
}
.card-target { font-size: 13px; font-weight: 600; color: #666; }
.card-meta { font-size: 13px; color: #999; }
.card-tips {
  font-size: 13px; line-height: 1.6; color: #2d7d46;
  padding: 6px 16px; margin: 0 12px 4px;
  background: #e8f5e9; border-left: 3px solid #2d7d46; border-radius: 0 4px 4px 0;
}
.card-bad {
  font-size: 13px; line-height: 1.6; color: #c62828;
  padding: 6px 16px; margin: 0 12px 6px;
  background: #ffebee; border-left: 3px solid #c62828; border-radius: 0 4px 4px 0;
}
.rpe-legend {
  display: flex; gap: 4px; align-items: center; padding: 0 16px 6px; font-size: 12px; color: #999;
}
.rpe-legend span { padding: 2px 6px; border-radius: 4px; }
.sets { padding: 0 16px; }
.set-row {
  display: flex; align-items: center; gap: 6px; padding: 6px 0;
  border-bottom: 1px solid #f5f5f5; flex-wrap: nowrap;
}
.set-row:last-child { border-bottom: none; }
.set-num { font-size: 13px; font-weight: 600; color: #999; min-width: 14px; }
.set-weight, .set-reps { display: inline-flex; align-items: center; gap: 2px; }
.set-weight input, .set-reps input {
  width: 48px; font-size: 15px; padding: 4px 6px; text-align: center;
  border: 1.5px solid #d0d4dc; border-radius: 6px; background: #fafbff;
}
.set-weight .u, .set-reps .u { font-size: 13px; color: #888; }
.rpe-group { display: inline-flex; gap: 2px; font-size: 0; padding: 2px 4px; border-radius: 6px; background: #f5f5f5; }
.rpe-group label {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; width: 28px; height: 26px; cursor: pointer;
  border-radius: 4px; color: #999; user-select: none;
}
.rpe-group label:has(input:checked) { background: #2d7d46; color: #fff; font-weight: 700; }
.rpe-group input { display: none; }
.feel-section { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 10px; }
.feel-section label {
  font-size: 13px; padding: 4px 10px; border: 1.5px solid #d0d4dc;
  border-radius: 8px; cursor: pointer; background: #fafbff;
}
.feel-section label:has(input:checked) { background: #e8f5e9; border-color: #2d7d46; }
.feel-section input { display: none; }
/* Stretching section */
.stretch-mandatory {
  background: #fff3e0; border-left: 4px solid #ff7043; margin: 10px 14px; border-radius: 10px;
  padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.stretch-mandatory h3 { font-size: 15px; margin: 0 0 8px; color: #e65100; }
.stretch-card {
  display: flex; flex-direction: column; gap: 8px;
}
.stretch-item {
  display: flex; align-items: flex-start; gap: 8px; font-size: 14px;
  padding: 8px; background: #fff; border-radius: 6px; border: 1px solid #ffe0b2;
}
.stretch-item .st-num { font-weight: 700; color: #ff7043; min-width: 16px; }
.stretch-item .st-detail { flex: 1; }
.stretch-item .st-name { font-weight: 600; }
.stretch-item .st-how { font-size: 13px; color: #888; margin-top: 2px; }
.scale-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.scale-item .sl { font-size: 14px; color: #888; min-width: 56px; }
.scale-opts { display: inline-flex; gap: 4px; background: #f5f5f5; border-radius: 6px; padding: 2px; }
.scale-opts label {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: #999;
}
.scale-opts label:has(input:checked) { background: #2d7d46; color: #fff; font-weight: 600; }
.scale-opts input { display: none; }
.notes-area { margin-top: 12px; }
.notes-area textarea {
  width: 100%; min-height: 80px; font-size: 15px; padding: 10px;
  border: 1.5px solid #d0d4dc; border-radius: 8px; resize: none; overflow: hidden;
  font-family: inherit; background: #fafbff;
}
@media (prefers-color-scheme: dark) {
  body { background: #121218; color: #e8eaef; }
  .app-header { background: linear-gradient(135deg, #0d2618, #1a4230); }
  .session-bar, .pre-section, .warmup-section, .card, .cardio-section, .bottom-section, .stretch-item { background: #1e1e35; }
  .session-btn { background: #1e1e35; border-color: #3a3a55; color: #aaa; }
  .session-btn.active { background: #2d7d46; }
  .rpe-group { background: #1e1e35; }
  .rpe-group label:has(input:checked) { background: #2d7d46; }
  .scale-opts { background: #1e1e35; }
  .scale-opts label:has(input:checked) { background: #2d7d46; }
  .pre-grid label, .tag-group label { border-color: #3a3a55; background: #1e1e35; }
  .pre-grid label:has(input:checked), .tag-group label:has(input:checked) { background: #1a3320; border-color: #2d7d46; }
  .feel-section label { border-color: #3a3a55; background: #1e1e35; }
  .feel-section label:has(input:checked) { background: #1a3320; border-color: #2d7d46; }
  .notes-area textarea { background: #1e1e35; border-color: #3a3a55; color: #e8eaef; }
  .set-weight input, .set-reps input { background: #1e1e35; border-color: #3a3a55; color: #e8eaef; }
  .card-tips { background: #1a2d1a; color: #4caf50; }
  .card-bad { background: #2d1a1a; color: #ef5350; }
  .stretch-mandatory { background: #2d1a10; }
  .stretch-item { background: #1e1e35; border-color: #3a2010; }
  .note-banner { background: #2d2010; }
  .save-indicator { background: #121218; }
}
@media (max-width: 400px) {
  .rpe-group label { width: 24px; height: 24px; font-size: 12px; }
  .set-weight input, .set-reps input { width: 42px; }
}
</style>
</head>

const KEY = 'hermes_fitness_c2';
let state = loadState();
let currentSession = state.currentSession || 0;

function defaultState() {
  const data = {};
  SESSIONS.forEach((s, si) => {
    const sk = `s${si}`;
    data[sk] = { pre:{}, warmup:{}, exs:{}, cardio:{type:'',dur:''}, stretch:{}, scales:{}, notes:'' };
    s.exs.forEach((eid, ei) => {
      data[sk].exs[eid] = {
        order: ei + 1,
        sets:[{w:'',r:'',rpe:''},{w:'',r:'',rpe:''},{w:'',r:'',rpe:''}],
        feel:[]
      };
    });
  });
  data.currentSession = 0;
  return data;
}

function loadState() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }
  catch(e) {}
  return defaultState();
}

function saveState() {
  state.currentSession = currentSession;
  localStorage.setItem(KEY, JSON.stringify(state));
  updateSyncIndicator();
}

// ═══════════ CLOUD SYNC ═══════════
const GITEE_TOKEN = '4094381111244372341df845351ffd88';
const GITEE_API = 'https://gitee.com/api/v5/repos/luiyizi/fitness-tracker-c2/contents/data.json';
const PAGES_DATA = 'data.json';
let syncStatus = 'local', cloudSHA = null, lastCloudData = null;

function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = {local:'☁️ 离线',syncing:'⏳',synced:'☁️ 已同步',error:'⚠️ ' + (lastSyncStatusMsg||'')}[s] || '☁️';
}
let lastSyncStatusMsg = '';
function updateSyncIndicator() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {local:'☁️ 本地保存', syncing:'⏳ 同步中...', synced:'☁️ 已同步', error:'⚠️ 同步失败'};
  el.textContent = map[syncStatus] || '☁️';
}

function countFilledSessions(data) {
  let count = 0;
  SESSIONS.forEach((s, si) => {
    const sk = `s${si}`;
    if (!data[sk] || !data[sk].exs) return;
    let hasData = false;
    s.exs.forEach(eid => {
      const ed = data[sk].exs[eid];
      if (ed && ed.sets && ed.sets.some(set => (set.w && set.w !== '') || (set.r && set.r !== '') || set.rpe)) hasData = true;
    });
    if (hasData) count++;
  });
  return count;
}

function b64Encode(str) {
  try { return btoa(unescape(encodeURIComponent(str))); } catch(e) { return btoa(str); }
}
function b64Decode(str) {
  try { return decodeURIComponent(escape(atob(str))); } catch(e) { return atob(str); }
}

let debounceTimer = null;
function autoSave() {
  saveState();
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => pushToCloud(state), 1200);
}

async function fetchFromCloud() {
  try {
    const resp = await fetch(GITEE_API + '?access_token=' + GITEE_TOKEN + '&t=' + Date.now());
    if (resp.ok) {
      const j = await resp.json();
      cloudSHA = j.sha;
      const decoded = b64Decode(j.content);
      const data = JSON.parse(decoded);
      if (data && typeof data === 'object' && data.s0) { lastCloudData = data; return data; }
    }
  } catch(e) { console.log('Gitee fetch failed, trying Pages:', e.message); }
  try {
    const resp = await fetch(PAGES_DATA + '?t=' + Date.now());
    if (resp.ok) {
      const data = await resp.json();
      if (data && typeof data === 'object' && data.s0) { lastCloudData = data; return data; }
    }
  } catch(e) { console.log('Pages fetch also failed:', e.message); }
  return null;
}

let pushLock = false;
async function pushToCloud(data) {
  if (pushLock) return false;
  pushLock = true;
  try {
    setSyncStatus('syncing');
    await fetchFromCloud();
    if (!cloudSHA) throw new Error('Cannot reach cloud');
    const content = b64Encode(JSON.stringify(data, null, 2));
    const body = new URLSearchParams();
    body.append('access_token', GITEE_TOKEN);
    body.append('content', content);
    body.append('sha', cloudSHA);
    body.append('message', 'sync: update Cycle 2 training data');
    const resp = await fetch(GITEE_API, { method: 'PUT', body: body });
    if (!resp.ok) {
      if (resp.status === 400 || resp.status === 422) {
        cloudSHA = null; await fetchFromCloud();
        if (!cloudSHA) throw new Error('Retry: cannot reach cloud');
        body.set('sha', cloudSHA);
        const resp2 = await fetch(GITEE_API, { method: 'PUT', body: body });
        if (!resp2.ok) throw new Error('HTTP ' + resp2.status);
        const r2 = await resp2.json();
        cloudSHA = r2.content?.sha || r2.sha;
        lastCloudData = data; setSyncStatus('synced');
        localStorage.setItem(KEY + '_lastSync', Date.now().toString());
        return true;
      }
      throw new Error('HTTP ' + resp.status);
    }
    const result = await resp.json();
    cloudSHA = result.content?.sha || result.sha;
    setSyncStatus('synced');
    lastCloudData = data;
    localStorage.setItem(KEY + '_lastSync', Date.now().toString());
    return true;
  } catch(e) {
    lastSyncStatusMsg = e.message;
    setSyncStatus('error');
    return false;
  } finally { pushLock = false; }
}

// ═══════════ EVENTS ═══════════
function bindEvents() {
  document.querySelectorAll('.session-btn').forEach(el => {
    el.addEventListener('click', () => {
      currentSession = parseInt(el.dataset.si);
      state.currentSession = currentSession;
      localStorage.setItem(KEY, JSON.stringify(state));
      render();
    });
  });

  // Pre-check
  document.querySelectorAll('[data-pre]').forEach(el => {
    el.addEventListener('change', () => {
      const pre = state[`s${currentSession}`].pre;
      pre[el.dataset.pre] = el.checked;
      if (!pre.done && el.checked) pre.done = true;
      if (!state[`s${currentSession}`].date) {
        state[`s${currentSession}`].date = new Date().toISOString().slice(0,10);
        const dp = document.getElementById('trainDate');
        if (dp) dp.value = state[`s${currentSession}`].date;
      }
      autoSave();
    });
  });

  // Warm-up checks
  document.querySelectorAll('[data-wu]').forEach(el => {
    el.addEventListener('change', () => {
      if (!state[`s${currentSession}`].warmup) state[`s${currentSession}`].warmup = {};
      state[`s${currentSession}`].warmup[el.dataset.wu] = el.checked;
      autoSave();
    });
  });

  // Date picker
  const datePicker = document.getElementById('trainDate');
  if (datePicker) {
    datePicker.addEventListener('change', () => {
      state[`s${currentSession}`].date = datePicker.value;
      autoSave();
    });
  }

  // Weight/reps
  document.querySelectorAll('.set-weight input, .set-reps input').forEach(el => {
    el.addEventListener('input', () => {
      const row = el.closest('.set-row');
      const eid = row.dataset.eid;
      const setIdx = parseInt(row.dataset.set);
      state[`s${currentSession}`].exs[eid].sets[setIdx][el.dataset.field] = el.value;
      autoSave();
    });
  });

  // RPE
  document.querySelectorAll('.rpe-group input').forEach(el => {
    el.addEventListener('change', () => {
      if (!el.checked) return;
      const row = el.closest('.set-row');
      const eid = row.dataset.eid;
      const setIdx = parseInt(row.dataset.set);
      state[`s${currentSession}`].exs[eid].sets[setIdx].rpe = parseInt(el.value);
      autoSave();
    });
  });

  // Feel
  document.querySelectorAll('[data-feel]').forEach(el => {
    el.addEventListener('change', () => {
      const card = el.closest('.card');
      const eid = card.querySelector('.set-row').dataset.eid;
      const feel = el.dataset.feel;
      const feels = state[`s${currentSession}`].exs[eid].feel;
      if (el.checked && !feels.includes(feel)) feels.push(feel);
      else if (!el.checked) { const idx = feels.indexOf(feel); if (idx > -1) feels.splice(idx, 1); }
      autoSave();
    });
  });

  // Cardio
  document.querySelectorAll('[name^="cardio_type_"]').forEach(el => {
    el.addEventListener('change', () => { if (el.checked) { state[`s${currentSession}`].cardio.type = el.value; autoSave(); } });
  });
  document.querySelectorAll('[name^="cardio_dur_"]').forEach(el => {
    el.addEventListener('change', () => { if (el.checked) { state[`s${currentSession}`].cardio.dur = el.value; autoSave(); } });
  });

  // Post-workout stretches
  document.querySelectorAll('[data-ps]').forEach(el => {
    el.addEventListener('change', () => {
      if (!state[`s${currentSession}`].stretch) state[`s${currentSession}`].stretch = {};
      state[`s${currentSession}`].stretch[el.dataset.ps] = el.checked;
      autoSave();
    });
  });

  // Scales
  document.querySelectorAll('[name^="sc_"]').forEach(el => {
    el.addEventListener('change', () => {
      if (el.checked) {
        const name = el.name;
        const idx = name.indexOf('_', name.indexOf('_')+1)+1;
        const scaleName = name.substring(idx);
        state[`s${currentSession}`].scales[scaleName] = el.value;
        autoSave();
      }
    });
  });

  // Notes
  const ta = document.querySelector('.notes-area textarea');
  if (ta) {
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    ta.addEventListener('input', (e) => {
      state[`s${currentSession}`].notes = e.target.value;
      e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
      autoSave();
    });
  }

  // Date
  document.getElementById('trainDate')?.addEventListener('change', (e) => {
    state[`s${currentSession}`].date = e.target.value;
    autoSave();
  });

  // Order
  document.querySelectorAll('select[data-field="order"]').forEach(el => {
    el.addEventListener('change', () => {
      state[`s${currentSession}`].exs[el.dataset.eid].order = parseInt(el.value);
      autoSave();
    });
  });
}

// ═══════════ GO ═══════════
render();
updateSyncIndicator();
setTimeout(() => initCloud(), 300);

async function initCloud() {
  const lastSync = localStorage.getItem(KEY + '_lastSync');
  if (lastSync && (Date.now() - parseInt(lastSync)) < 86400000) setSyncStatus('synced');
  const cloud = await fetchFromCloud();
  if (!cloud) { if (syncStatus !== 'synced') setSyncStatus('local'); return; }
  state = cloud;
  const dflt = defaultState();
  SESSIONS.forEach((s, si) => {
    const sk = `s${si}`;
    if (!state[sk]) state[sk] = dflt[sk];
    if (!state[sk].exs || Object.keys(state[sk].exs).length === 0) state[sk].exs = dflt[sk].exs;
    if (!state[sk].warmup) state[sk].warmup = {};
    const exs = state[sk].exs;
    Object.keys(exs).forEach((eid, ei) => { if (!exs[eid].order) exs[eid].order = ei + 1; });
  });
  // Migrate old per-set feel
  SESSIONS.forEach((s, si) => {
    const sk = `s${si}`;
    const exs = state[sk].exs; if (!exs) return;
    Object.keys(exs).forEach(eid => {
      const ed = exs[eid];
      if (ed.sets && ed.sets[0] && ed.sets[0].feel !== undefined) {
        if (!ed.feel) ed.feel = [];
        const allFeels = new Set();
        ed.sets.forEach(set => { if (set.feel) set.feel.forEach(f => allFeels.add(f)); delete set.feel; });
        ed.feel = [...allFeels];
      }
      if (!ed.feel) ed.feel = [];
    });
  });
  currentSession = currentSession || state.currentSession || 0;
  state.currentSession = currentSession;
  localStorage.setItem(KEY, JSON.stringify(state));
  setSyncStatus('synced');
  localStorage.setItem(KEY + '_lastSync', Date.now().toString());
  render();
  updateSyncIndicator();
}
</script>
